services:
  - type: web
    name: cafeteria-system
    runtime: docker
    rootDir: CafeteriaSystemBS
    plan: free
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: cafeteria_system
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
